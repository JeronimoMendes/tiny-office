# Development overlay: runs the app container from the mounted source tree with
# hot reload, and exposes PostgreSQL on loopback for host-side tooling.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up
#
# Vite serves the client on VITE_PORT (5173 by default) and proxies /api and
# /ws to the server, so open http://localhost:5173. APP_PORT still serves the
# image's production build, which is stale in this mode. Rebuild the image after
# dependency changes: node_modules comes from the image, not the mount.
#
# The container keeps its own ports; only the published ones move, so a worktree
# with a generated .env runs this stack beside the office already up.
services:
  db:
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
  app:
    command: npm run dev
    # Vite caches under the image's node_modules, which npm ci created as root.
    user: root
    environment:
      NODE_ENV: development
      APP_ORIGIN: ${DEV_APP_ORIGIN:-http://localhost:${VITE_PORT:-5173}}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${VITE_PORT:-5173}:5173'
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./tsconfig.json:/app/tsconfig.json:ro
