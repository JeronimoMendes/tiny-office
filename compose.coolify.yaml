# Coolify deployment. Add this repository as a "Docker Compose" resource and set
# this file as the compose path. Coolify's proxy terminates TLS and routes the
# domains you set on the app and livekit services; media UDP bypasses the proxy.
# See README "Deploying on Coolify".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: office
    volumes:
      - office-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U office -d office']
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    # No --node-ip: use_external_ip below discovers the public address instead.
    command: --bind 0.0.0.0
    environment:
      # Coolify runs the stack outside the repository clone, so a bind-mounted
      # config resolves to a path Docker replaces with an empty directory. The
      # config travels in this file instead; LIVEKIT_CONFIG is --config-body.
      # A config body ignores LIVEKIT_KEYS, so the keys belong in it too.
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
        logging:
          level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          # Published straight on the host, so LiveKit must advertise the
          # server's own public address rather than the container IP.
          use_external_ip: true
        # Clients whose firewall blocks outbound UDP fall back to 7881/tcp. If
        # that is not enough, enable TURN/TLS here with a certificate for the
        # LiveKit domain and publish 5349/tcp plus 3478/udp; see README.
        # turn:
        #   enabled: true
        #   domain: livekit.example.com
        #   cert_file: /etc/livekit/tls/fullchain.pem
        #   key_file: /etc/livekit/tls/privkey.pem
        #   tls_port: 5349
        #   udp_port: 3478
    # Signaling reaches 7880 through the proxy; RTC needs the host directly.
    expose:
      - '7880'
    ports:
      - '7881:7881'
      - '7882:7882/udp'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7880/']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/office
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN to the https origin}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-}
      WORKSPACE_ID: ${WORKSPACE_ID:-00000000-0000-4000-8000-000000000001}
      MAP_FILE: ${MAP_FILE:-maps/office.tmj}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:?set LIVEKIT_WS_URL to the wss endpoint}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  office-data:
