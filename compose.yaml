services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-office}
      POSTGRES_DB: office
    volumes:
      - office-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U office -d office']
      interval: 2s
      timeout: 3s
      retries: 20
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}'
      # Clients are told to reach the media ports directly, so the container
      # listens on the same numbers the host publishes rather than a remapping.
      LIVEKIT_PORT: ${LIVEKIT_PORT:-7880}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_TCP_PORT:-7881}
      UDP_PORT: ${LIVEKIT_UDP_PORT:-7882}
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - '${LIVEKIT_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_PORT:-7880}:${LIVEKIT_PORT:-7880}'
      - '${LIVEKIT_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}'
      - '${LIVEKIT_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:${LIVEKIT_PORT:-7880}/']
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD:-office}@db:5432/office
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-}
      WORKSPACE_ID: ${WORKSPACE_ID:-00000000-0000-4000-8000-000000000001}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAP_FILE: ${MAP_FILE:-maps/office.tmj}
      LIVEKIT_URL: http://livekit:${LIVEKIT_PORT:-7880}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - ./maps:/app/maps:ro
      - ./assets:/app/assets:ro
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_healthy
    stop_grace_period: 15s
volumes:
  office-data:
