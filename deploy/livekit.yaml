# Self-hosted SFU for one workspace. Credentials come from LIVEKIT_KEYS, and
# the ports from LIVEKIT_PORT / LIVEKIT_RTC_TCP_PORT / UDP_PORT, so a worktree
# can move the whole stack out of the way of the office already running.
logging:
  level: info
rtc:
  # Compose publishes the ports on loopback, so advertise the address given by
  # --node-ip. Deployments discover the public address instead: drop --node-ip
  # from compose.yaml and set use_external_ip: true.
  use_external_ip: false
# Enable TURN for clients whose firewall blocks direct UDP. TURN/TLS needs a
# certificate for a real domain and is usually published on 443; see README.
# turn:
#   enabled: true
#   domain: office.example.com
#   cert_file: /etc/livekit/tls/fullchain.pem
#   key_file: /etc/livekit/tls/privkey.pem
#   tls_port: 5349
#   udp_port: 3478
